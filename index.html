<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FocusFlow — Todo App</title>
    <meta
      name="description"
      content="기깔나는 정적 투두리스트 웹앱입니다."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-orb orb-one"></div>
    <div class="bg-orb orb-two"></div>

    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Daily planner</p>
          <h1>FocusFlow</h1>
        </div>
        <div class="topbar-meta">
          <span class="dot"></span>
          <span id="todayLabel">오늘</span>
        </div>
      </header>

      <section class="stats" aria-label="투두 통계">
        <article class="stat-card">
          <span class="label">전체</span>
          <strong id="totalTasks">0</strong>
        </article>
        <article class="stat-card accent">
          <span class="label">완료</span>
          <strong id="doneTasks">0</strong>
        </article>
        <article class="stat-card warn">
          <span class="label">남은 일</span>
          <strong id="openTasks">0</strong>
        </article>
      </section>

      <section class="composer" aria-label="투두 입력">
        <form id="todoForm" class="todo-form">
          <label class="field text-field" for="todoInput">
            <span class="sr-only">새 할 일</span>
            <input
              id="todoInput"
              type="text"
              maxlength="120"
              placeholder="예: 디자인 시안 검토하기"
              autocomplete="off"
            />
          </label>

          <div class="field-group">
            <label class="field select-field" for="prioritySelect">
              <span class="sr-only">우선순위</span>
              <select id="prioritySelect">
                <option value="low">낮음</option>
                <option value="medium" selected>보통</option>
                <option value="high">높음</option>
              </select>
            </label>

            <label class="field date-field" for="dueDateInput">
              <span class="sr-only">마감일</span>
              <input id="dueDateInput" type="date" />
            </label>
          </div>

          <button type="submit" class="primary-btn">추가하기</button>
        </form>
      </section>

      <section class="panel" aria-label="할 일 목록">
        <div class="panel-header">
          <h2>할 일 목록</h2>
          <div class="filters" aria-label="필터">
            <button class="filter-btn active" type="button" data-filter="all">전체</button>
            <button class="filter-btn" type="button" data-filter="active">진행 중</button>
            <button class="filter-btn" type="button" data-filter="completed">완료</button>
          </div>
        </div>

        <ul id="taskList" class="task-list" aria-live="polite"></ul>
      </section>
    </main>

    <template id="taskTemplate">
      <li class="task-item">
        <label class="task-main">
          <input type="checkbox" class="task-check" />
          <span class="task-copy">
            <span class="task-text"></span>
            <span class="task-meta"></span>
          </span>
        </label>

        <div class="task-actions">
          <span class="priority-badge"></span>
          <button type="button" class="delete-btn" aria-label="삭제">삭제</button>
        </div>
      </li>
    </template>

    <script src="script.js"></script>
  </body>
</html>
